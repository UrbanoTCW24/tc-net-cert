# Compila el wheel en cada push/PR a main — valida que el paquete sigue construyible.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel

      - name: Smoke — version inside wheel
        run: |
          WHL="$(ls -1 dist/tc_net_cert-*.whl | head -1)"
          WHL="${WHL}" python3 - <<'PY'
          import os, re, zipfile
          from pathlib import Path
          whl = Path(os.environ["WHL"])
          with zipfile.ZipFile(whl) as zf:
              name = next(n for n in zf.namelist() if n.endswith("tc_net_cert/version.py"))
              text = zf.read(name).decode()
          ver = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          assert ver, "missing __version__"
          print("wheel version:", ver.group(1))
          PY
